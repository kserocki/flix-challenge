name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kmp: ${{ steps.filter.outputs.kmp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            kmp:
              - 'core/common/**'
              - 'core/domain/**'
              - 'core/data/**'
              - 'core/testing/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check and assemble debug APK
        run: ./gradlew check :app:assembleDebug --continue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-reports
          path: |
            **/build/reports/**
            **/build/test-results/**

  ios:
    needs: changes
    # On pull requests only when KMP sources or the build change; always on main (ADR-0008).
    if: github.event_name != 'pull_request' || needs.changes.outputs.kmp == 'true'
    # macos-15 has far more runner capacity than macos-26; Xcode 26.3 provides the iOS SDK
    # Kotlin/Native needs.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Run common tests and compile the device target
        run: ./gradlew iosSimulatorArm64Test compileKotlinIosArm64 --continue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ios-reports
          path: |
            **/build/reports/**
            **/build/test-results/**

  ci-passed:
    runs-on: ubuntu-24.04
    needs: [changes, android, ios]
    if: always()
    steps:
      - name: Fail if a required job did not succeed
        # Anything but success fails the gate (a job that never got a runner reports neither failure
        # nor cancelled). iOS may be skipped only when the path filter decided so.
        if: >-
          needs.changes.result != 'success' ||
          needs.android.result != 'success' ||
          (needs.ios.result != 'success' &&
            !(needs.ios.result == 'skipped' && needs.changes.outputs.kmp != 'true' && github.event_name == 'pull_request'))
        run: exit 1
