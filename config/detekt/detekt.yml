# Overrides on top of Detekt's own defaults (`buildUponDefaultConfig: true` in `flix.quality`),
# plus every rule from `io.nlopez.compose.rules:detekt` 0.6.8 at its documented default.

naming:
  FunctionNaming:
    active: true
    # Composables are PascalCase and are separately checked by compose-rules' ComposableNaming.
    ignoreAnnotated: ['Composable']
    # Detekt's own default excludes plus AGP 9's KMP host-test source set, so backticked test
    # names (`shows empty state when no departures in window`) pass there too.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/androidHostTest/**']

complexity:
  LongParameterList:
    active: true
    # Composables take explicit values and present-tense callbacks (AGENTS.md §4), never an
    # XUiState-wide parameter, so a long parameter list is expected for them, not a smell.
    ignoreAnnotated: ['Composable']

Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableNestingDepth:
    active: false
  ComposableParamOrder:
    active: true
